name: 항공권 가격 수집

on:
  schedule:
    # 주 3회 = 한국시간 월·수·금 08:47 (UTC 로는 전날 일·화·목 23:47)
    #
    # RapidAPI 무료(BASIC) 등급의 실제 한도는 월 20회다. 처음엔 월 100회로 잘못 알고
    # 하루 2회(월 약 61회)로 돌렸다가 2026-09-06 에 한도가 바닥나 24일간 수집이 멈췄다.
    # 주 3회면 월 약 13회로, 수동 실행용 여유 7회가 남는다.
    #
    # 시각 선택 이유: GitHub Actions 예약은 정시 보장이 없고 혼잡 시간대에 크게 밀린다.
    # 00:10 UTC 로 뒀더니 2026-09-01 에 4시간 50분 지연됐다. 자정 UTC 직후와
    # 정각·15분 단위는 전 세계 예약이 몰리므로, 어중간한 시·분으로 옮긴다.
    - cron: "47 23 * * 0,2,4"
  workflow_dispatch:        # Actions 탭에서 수동 실행용

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 가격 수집
        id: collect
        continue-on-error: true    # 실패해도 오류 상태를 사이트에 기록해야 하므로 계속 진행
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 collector/collect.py

      - name: 결과 커밋
        run: |
          git config user.name  "flight-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "데이터 수집: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 수집 실패 시 워크플로도 실패 처리
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 로그를 확인하세요."
          exit 1
